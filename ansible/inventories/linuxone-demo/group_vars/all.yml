---
# =============================================================================
# LinuxONE demo -- group variables
# =============================================================================
# Sized from z-stream-sizer for IBM z16 (Telum), OCP topology, dedicated IFLs.
# Verified against the engine: 3 brokers + 2 TaskManagers => 32 IFLs,
# 212 GB central storage, 38.88 TB usable (50 MB/s, 3d retention, RF 3).
# =============================================================================

demo_namespace: confluent
demo_scenario_dir: "{{ playbook_dir }}/../../scenarios/cfk-openshift-linuxone-demo"

# --- LPAR allocation (FIXED -- the z16 BoM, not revisable) -------------------
# 32 IFLs / 212 GB is what the mainframe team allocated. It took weeks to
# obtain and is not being renegotiated. Everything below fits inside it.
lpar_ifl_budget: 32
lpar_ram_gb: 212

# --- Topology ---------------------------------------------------------------
kafka_brokers: 3
flink_taskmanagers: 2
connect_replicas: 2

# --- Fitting Connect inside a fixed 32 IFLs ---------------------------------
# z-stream-sizer does not model a Connect tier at all, and at its default
# 12 x86-ref vCPU/broker the Confluent estate consumes all 32 IFLs and all
# 212 GB with zero spare -- so Connect had nowhere to live.
#
# Rather than raise the ask, the BROKER tier is trimmed. Brokers are the
# least-loaded component in a MongoDB CDC demo, so the capacity is taken
# where it is least missed:
#
#   sizer default (12 vCPU, 16 GB heap): 36/8 = 4.5 -> 5 IFLs, estate 32/212
#   trimmed here  (10 vCPU, 14 GB heap): 30/8 = 3.75 -> 4 IFLs, estate 31/199
#                                        + Connect 1 IFL / 8 GB = 32 / 207
#
# Result: exactly 32 IFLs, 207 GB, 5 GB spare. Verified against the sizer
# engine. Do NOT carry this trim into a production sizing -- re-run the sizer.
vcpu_per_broker: 10
broker_heap_gb: 14
broker_page_cache_gb: 14

# Two workers at 1000m cost the same 1 IFL as one worker at 2000m, because
# SMT-2 rounding makes ceil(2x1/2) == ceil(1x2/2). Two therefore buys
# worker-restart survivability for 4 GB and zero IFLs.
connect_cpu_logical_per_replica: 1
connect_ram_gb_per_replica: 4

# --- Storage ----------------------------------------------------------------
# 38.88 TB usable = 50 MB/s x 86400 s x 3 days x RF 3. Independent of broker
# count -- growing to 9 brokers does not change the FICON allocation.
storage_fabric: ficon
aggregate_ingest_mbs: 50
retention_days: 3
replication_factor: 3

# --- MongoDB: EXTERNAL DEPENDENCY, owned by another team ---------------------
# Nothing in this repo provisions MongoDB. The MongoDB team stands it up on
# LinuxONE (supported on s390x under the MongoDB/IBM OEM agreement) and hands
# over a connection string. Our side owns only the Secret and the connectors.
#
# Create the Secret from what they give you:
#   oc create secret generic mongodb-demo-creds -n confluent \
#     --from-literal=connection_uri='mongodb://<user>:<pass>@<host>:27017/?replicaSet=<rs>'
#
# THE CONTRACT WITH THAT TEAM -- confirm all four before demo day:
#   1. It is a REPLICA SET, not a standalone. Change streams do not exist on a
#      standalone mongod, and that failure only surfaces at first read.
#   2. The connection URI includes replicaSet=<name>.
#   3. Database 'demo' with collection 'customer' exists and is writable, and
#      collection 'customer_enriched' is free for the sink to own.
#   4. The credentials carry changeStream/read on demo.customer and write on
#      demo.customer_enriched.
mongo_secret_name: mongodb-demo-creds
mongo_host: <PLACEHOLDER_MONGODB_HOST>
mongo_port: 27017
# The TCP probe only means anything if this Ansible controller shares a
# network with MongoDB. Set false when running from a workstation outside
# the frame -- the Connect pods may still reach it fine.
mongo_reachability_check: true

# --- Image pins -------------------------------------------------------------
# CP 8.2.0 is the FLOOR for s390x. Earlier CP releases ship no s390x
# artifacts. FKO/CMF versions match ansible/roles/flink_operators defaults.
cp_version: "8.2.0"
cfk_init_container_version: "2.11.0"
fko_helm_chart_version: "1.14.0"
cmf_helm_chart_version: "2.3.0"
flink_namespace: confluent
