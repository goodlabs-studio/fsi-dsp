---
# =============================================================================
# Inventory -- LinuxONE (s390x) demo cluster
# =============================================================================
# Everything runs locally against the OpenShift API via kubernetes.core, so
# there are no managed hosts. The inventory exists to carry group_vars.
#
# PRECONDITION -- confirm the kube context BEFORE running anything:
#   oc config current-context
# A context pointing at the wrong cluster is the most common way this goes
# wrong, and it fails late and confusingly.
# =============================================================================
all:
  hosts:
    localhost:
      ansible_connection: local
      ansible_python_interpreter: "{{ ansible_playbook_python }}"
