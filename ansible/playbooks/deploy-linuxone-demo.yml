---
# =============================================================================
# FSI Kafka Platform -- LinuxONE (s390x) DEMO cluster deployment
# =============================================================================
# Confluent Platform + CMF Flink + Kafka Connect (MongoDB source/sink) on
# OpenShift on IBM z16, sized to a 32-IFL / 212 GB dedicated LPAR.
#
# DEMO-GRADE. No mTLS, no RBAC, no Vault, no audit sink, no FIPS. Do not point
# this at regulated data -- layer accelerators/confluent-on-linuxone/ on top
# first.
#
# SCOPE: this deploys the CONFLUENT side only. MongoDB is provisioned and
# owned by a different team; nothing here stands it up. Play 3 verifies their
# handover satisfies the connector's contract, and stops if it does not.
#
# Play order matters:
#   0. Preflight  -- fail closed if the topology does not fit the LPAR
#   1. CFK        -- operator + Kafka/KRaft/Schema Registry CRs
#   2. Flink      -- FKO + CMF operators, then the session cluster
#   3. MongoDB    -- VERIFY the other team's instance (replica set required)
#   4. Connect    -- Connect cluster, then the two Connector CRs
#
# Usage:
#   ansible-playbook ansible/playbooks/deploy-linuxone-demo.yml \
#     -i ansible/inventories/linuxone-demo/hosts.yml
#
#   # size-only, no cluster contact:
#   ansible-playbook ansible/playbooks/deploy-linuxone-demo.yml \
#     -i ansible/inventories/linuxone-demo/hosts.yml --tags preflight
#
#   # dry-run audit of everything:
#   ansible-playbook ansible/playbooks/deploy-linuxone-demo.yml \
#     -i ansible/inventories/linuxone-demo/hosts.yml --check
# =============================================================================

# --- Play 0: LPAR budget gate ------------------------------------------------
# Runs first and independently of the cluster. Catches "you scaled brokers to
# 6 on a 32-IFL LPAR" before anything is applied and pods start Pending.
- name: Preflight LPAR IFL and central-storage budget
  hosts: localhost
  connection: local
  gather_facts: false
  tags:
    - preflight
    - always
  tasks:
    - name: Assert topology fits the LinuxONE LPAR
      ansible.builtin.include_role:
        name: z_lpar_preflight

# --- Play 1: CFK operator + Kafka / KRaft / Schema Registry ------------------
- name: Deploy CFK operator and Kafka platform
  hosts: localhost
  connection: local
  gather_facts: false
  tags:
    - cfk
  tasks:
    - name: Deploy CFK operator and platform CRs
      ansible.builtin.include_role:
        name: cfk_operator

# --- Play 2: Flink operators (FKO + CMF) ------------------------------------
- name: Deploy FKO and CMF Flink operators
  hosts: localhost
  connection: local
  gather_facts: false
  tags:
    - flink
  tasks:
    - name: Deploy FKO and CMF via Helm
      ansible.builtin.include_role:
        name: flink_operators

    - name: Apply demo Flink session cluster
      kubernetes.core.k8s:
        state: present
        namespace: "{{ demo_namespace }}"
        src: "{{ demo_scenario_dir }}/flink/flink-session-cluster.yaml"
        wait: true
        wait_timeout: 600

# --- Play 3: verify the MongoDB the other team provides ----------------------
# MongoDB is stood up and owned by a DIFFERENT TEAM. Nothing here provisions
# it -- this play only verifies that what they handed over satisfies the
# contract the source connector depends on, and fails with a message naming
# whose problem it is.
#
# The check that matters: change streams REQUIRE a replica set. A standalone
# mongod deploys clean and then fails at RUNTIME with
# "The $changeStream stage is only supported on replica sets" -- after the
# whole platform is up and someone is watching a demo. Catch it here instead.
- name: Verify the MongoDB dependency provided by the MongoDB team
  hosts: localhost
  connection: local
  gather_facts: false
  tags:
    - mongodb
    - preflight
  tasks:
    - name: Look up the MongoDB connection secret
      kubernetes.core.k8s_info:
        kind: Secret
        name: "{{ mongo_secret_name }}"
        namespace: "{{ demo_namespace }}"
      register: _mongo_secret
      changed_when: false

    - name: Assert the MongoDB connection secret exists
      ansible.builtin.assert:
        that:
          - (_mongo_secret.resources | length) > 0
        fail_msg: >-
          Secret '{{ mongo_secret_name }}' not found in namespace
          '{{ demo_namespace }}'. The MongoDB team owns provisioning; you own
          creating this secret from the connection string they provide:
            oc create secret generic {{ mongo_secret_name }} -n {{ demo_namespace }} \
              --from-literal=connection_uri='mongodb://<user>:<pass>@<host>:27017/?replicaSet=<rs>'
        success_msg: "Secret '{{ mongo_secret_name }}' present."

    - name: Decode the connection URI
      ansible.builtin.set_fact:
        _mongo_uri: >-
          {{ _mongo_secret.resources[0].data.connection_uri | b64decode }}
      no_log: true

    # Contract check, not a live probe: a URI without replicaSet= means the
    # MongoDB team handed over a standalone, and change streams will not work.
    - name: Assert the connection URI targets a replica set
      ansible.builtin.assert:
        that:
          - "'replicaSet=' in _mongo_uri"
        fail_msg: >-
          The connection URI in '{{ mongo_secret_name }}' has no replicaSet=
          parameter, which means it points at a standalone mongod. MongoDB
          change streams -- which the source connector requires -- are only
          available on a replica set. This is a DEPENDENCY GAP to raise with
          the MongoDB team: ask them to initiate a replica set (even a
          single-member one) and reissue the connection string. Everything
          would otherwise deploy cleanly and fail at first change-stream read.
        success_msg: "Connection URI targets a replica set."

    # Best-effort TCP reachability. Only meaningful when the Ansible controller
    # sits on a network that can reach MongoDB; skip it when running from a
    # workstation outside the frame.
    - name: Check MongoDB is reachable from this controller
      ansible.builtin.wait_for:
        host: "{{ mongo_host }}"
        port: "{{ mongo_port }}"
        timeout: 10
      register: _mongo_reach
      failed_when: false
      changed_when: false
      when: mongo_reachability_check | bool

    - name: Report MongoDB reachability
      ansible.builtin.debug:
        msg: >-
          {{ mongo_host }}:{{ mongo_port }} —
          {{ 'reachable' if (_mongo_reach.state | default('')) == 'started'
             else 'NOT reachable from this controller (may still be reachable
             from the Connect pods; verify in-cluster if the connector fails)' }}
      when: mongo_reachability_check | bool

# --- Play 4: Connect cluster + MongoDB connectors ---------------------------
- name: Deploy Connect and the MongoDB source/sink connectors
  hosts: localhost
  connection: local
  gather_facts: false
  tags:
    - connect
  tasks:
    - name: Apply demo topics (DLQ topics must exist before the connectors)
      kubernetes.core.k8s:
        state: present
        namespace: "{{ demo_namespace }}"
        src: "{{ demo_scenario_dir }}/topics/demo-topics.yaml"

    # The Connect cluster must be Ready before Connector CRs are applied --
    # CFK will accept a Connector CR against a non-existent cluster and leave
    # it stuck without a useful error.
    - name: Wait for Connect cluster to be Ready
      kubernetes.core.k8s_info:
        kind: Connect
        api_version: platform.confluent.io/v1beta1
        name: connect
        namespace: "{{ demo_namespace }}"
      register: _connect_ready
      until: >-
        (_connect_ready.resources | length) > 0 and
        (_connect_ready.resources[0].status.readyReplicas | default(0) | int) >= 1
      retries: 40
      delay: 15
      changed_when: false

    - name: Apply MongoDB source and sink Connector CRs
      kubernetes.core.k8s:
        state: present
        namespace: "{{ demo_namespace }}"
        src: "{{ item }}"
      loop:
        - "{{ demo_scenario_dir }}/connectors/mongodb-source.yaml"
        - "{{ demo_scenario_dir }}/connectors/mongodb-sink.yaml"

    - name: Report connector status
      kubernetes.core.k8s_info:
        kind: Connector
        api_version: platform.confluent.io/v1beta1
        namespace: "{{ demo_namespace }}"
        label_selectors:
          - "app.kubernetes.io/part-of=fsi-linuxone-demo"
      register: _connectors
      changed_when: false

    - name: Show connector states
      ansible.builtin.debug:
        msg: >-
          {{ _connectors.resources
             | map(attribute='metadata.name') | list }}
          states={{ _connectors.resources
             | map(attribute='status.state', default='unknown') | list }}
