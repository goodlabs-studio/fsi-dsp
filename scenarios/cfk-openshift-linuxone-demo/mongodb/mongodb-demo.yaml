---
# =============================================================================
# MongoDB -- demo instance for the LinuxONE Connect source/sink demo
# =============================================================================
# Demo-grade only: single node, no auth beyond a root user, no backups, no
# encryption at rest. Not an L1 store. The production shape is a 3-member
# in-frame replica set with 2 cross-frame members -- see
# wiki patterns/fsi-l1-reference-architecture.md.
#
# ---------------------------------------------------------------------------
# TWO THINGS THAT WILL BREAK THIS DEMO IF YOU SKIP THEM
# ---------------------------------------------------------------------------
#
# 1. ARCHITECTURE. MongoDB Community does not reliably publish s390x container
#    images. Confluent runs on s390x; MongoDB may not. VERIFY BEFORE DEPLOYING:
#
#      podman manifest inspect docker.io/library/mongo:7 | grep -i s390x
#
#    If that returns nothing, you have three options, in order of preference:
#      a) Run MongoDB on an x86 worker in a mixed-arch OCP cluster (the
#         default below -- no arch affinity is set, so the scheduler places it
#         wherever it fits). Connect still runs on s390x and reaches it over
#         the cluster network.
#      b) Point the demo at an existing MongoDB outside the cluster; delete
#         this file and set connection_uri in the secret to that host.
#      c) Build MongoDB from the s390x tarball (see the L1 reference
#         architecture note: "WiredTiger; ensure s390x tarball").
#    Do NOT run it under QEMU emulation -- the throughput penalty is ~10x and
#    change-stream latency becomes meaningless as a demo.
#
# 2. REPLICA SET. MongoDB change streams REQUIRE a replica set. A standalone
#    mongod cannot feed the source connector -- it fails with
#    "The $changeStream stage is only supported on replica sets". Even a
#    single node must be initiated as one. The Job at the bottom does that.
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: mongodb-demo
  namespace: confluent
  labels:
    app: mongodb-demo
    app.kubernetes.io/part-of: fsi-linuxone-demo
spec:
  clusterIP: None          # headless -- replica set members need stable DNS
  selector:
    app: mongodb-demo
  ports:
    - name: mongodb
      port: 27017
      targetPort: 27017

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb-demo
  namespace: confluent
  labels:
    app: mongodb-demo
    app.kubernetes.io/part-of: fsi-linuxone-demo
spec:
  serviceName: mongodb-demo
  replicas: 1
  selector:
    matchLabels:
      app: mongodb-demo
  template:
    metadata:
      labels:
        app: mongodb-demo
    spec:
      # NO arch affinity on purpose -- see note 1 above. In a mixed-arch
      # cluster this lands on whatever node has an image for it, which is
      # usually x86. Add an s390x nodeAffinity block here ONLY after
      # confirming an s390x manifest exists.
      containers:
        - name: mongodb
          image: mongo:7
          args:
            - "--replSet"
            - "rs0"
            - "--bind_ip_all"
          ports:
            - containerPort: 27017
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mongodb-demo-root
                  key: username
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongodb-demo-root
                  key: password
          resources:
            requests:
              cpu: "500m"
              memory: "2Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          volumeMounts:
            - name: data
              mountPath: /data/db
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi

---
# --- Replica-set initiation --------------------------------------------------
# Runs once. Without this the source connector cannot open a change stream.
# Idempotent: rs.initiate() on an already-initiated set returns an error that
# we swallow, so re-running the Job is safe.
apiVersion: batch/v1
kind: Job
metadata:
  name: mongodb-demo-rs-init
  namespace: confluent
  labels:
    app: mongodb-demo
    app.kubernetes.io/part-of: fsi-linuxone-demo
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: rs-init
          image: mongo:7
          env:
            - name: MONGO_USER
              valueFrom:
                secretKeyRef:
                  name: mongodb-demo-root
                  key: username
            - name: MONGO_PASS
              valueFrom:
                secretKeyRef:
                  name: mongodb-demo-root
                  key: password
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              HOST="mongodb-demo-0.mongodb-demo.confluent.svc.cluster.local:27017"

              echo "waiting for mongod to answer..."
              until mongosh --quiet \
                    -u "$MONGO_USER" -p "$MONGO_PASS" \
                    --authenticationDatabase admin \
                    "mongodb://${HOST}/?directConnection=true" \
                    --eval 'db.adminCommand({ping:1})' >/dev/null 2>&1; do
                sleep 3
              done

              echo "initiating replica set rs0 (idempotent)..."
              mongosh --quiet \
                -u "$MONGO_USER" -p "$MONGO_PASS" \
                --authenticationDatabase admin \
                "mongodb://${HOST}/?directConnection=true" --eval "
                  try {
                    rs.initiate({_id:'rs0', members:[{_id:0, host:'${HOST}'}]});
                    print('rs.initiate() OK');
                  } catch (e) {
                    if (e.codeName === 'AlreadyInitialized') {
                      print('already initialized - nothing to do');
                    } else { throw e; }
                  }
                "

              echo "waiting for PRIMARY..."
              until mongosh --quiet \
                    -u "$MONGO_USER" -p "$MONGO_PASS" \
                    --authenticationDatabase admin \
                    "mongodb://${HOST}/?directConnection=true" \
                    --eval 'quit(db.hello().isWritablePrimary ? 0 : 1)'; do
                sleep 3
              done

              echo "seeding demo collection so the source connector has data..."
              mongosh --quiet \
                -u "$MONGO_USER" -p "$MONGO_PASS" \
                --authenticationDatabase admin \
                "mongodb://${HOST}/?replicaSet=rs0" --eval "
                  db.getSiblingDB('demo').customer.insertOne(
                    {name:'seed', created:new Date()});
                  print('seeded demo.customer');
                "

              echo "DONE - replica set rs0 is PRIMARY and change streams are available"
