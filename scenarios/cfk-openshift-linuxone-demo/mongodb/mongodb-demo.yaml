---
# =============================================================================
# MongoDB -- demo instance for the LinuxONE Connect source/sink demo
# =============================================================================
# Demo-grade only: single node, no auth beyond a root user, no backups, no
# encryption at rest. Not an L1 store. The production shape is a 3-member
# in-frame replica set with 2 cross-frame members -- see
# wiki patterns/fsi-l1-reference-architecture.md.
#
# ---------------------------------------------------------------------------
# TWO THINGS THAT WILL BREAK THIS DEMO IF YOU SKIP THEM
# ---------------------------------------------------------------------------
#
# 1. IMAGE SOURCE. MongoDB IS supported on s390x -- it ships under the
#    MongoDB/IBM OEM agreement for LinuxONE. What you will NOT find is a
#    community s390x manifest on Docker Hub: `docker.io/library/mongo` is
#    x86/arm only, because the Z build is distributed through IBM rather than
#    published to the public registry.
#
#    So: pull the OEM image from the IBM-provided registry (or your internal
#    mirror of it) and set it below. Do NOT fall back to the community tag and
#    do NOT run it under QEMU emulation -- the ~10x throughput penalty makes
#    change-stream latency meaningless as a demo.
#
#    This pod is pinned to s390x on purpose. It runs in-frame alongside
#    Confluent, which is the whole point of an L1 demo: the operational store
#    and the streaming platform on the same machine.
#
# 2. REPLICA SET. MongoDB change streams REQUIRE a replica set. A standalone
#    mongod cannot feed the source connector -- it fails with
#    "The $changeStream stage is only supported on replica sets". Even a
#    single node must be initiated as one. The Job at the bottom does that.
#
# NOTE ON SIZING: this MongoDB pod is NOT in the 32-IFL Confluent BoM.
# z-stream-sizer models the Confluent estate only. On a shared LPAR its
# 500m/2Gi request competes with Confluent; on the L1 reference architecture
# the operational stores get their own LPAR. Confirm which applies before
# treating the 32 IFLs as covering this too.
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: mongodb-demo
  namespace: confluent
  labels:
    app: mongodb-demo
    app.kubernetes.io/part-of: fsi-linuxone-demo
spec:
  clusterIP: None          # headless -- replica set members need stable DNS
  selector:
    app: mongodb-demo
  ports:
    - name: mongodb
      port: 27017
      targetPort: 27017

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb-demo
  namespace: confluent
  labels:
    app: mongodb-demo
    app.kubernetes.io/part-of: fsi-linuxone-demo
spec:
  serviceName: mongodb-demo
  replicas: 1
  selector:
    matchLabels:
      app: mongodb-demo
  template:
    metadata:
      labels:
        app: mongodb-demo
    spec:
      # Pinned to s390x: the OEM MongoDB build runs in-frame beside Confluent.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/arch
                    operator: In
                    values:
                      - s390x
      tolerations:
        - key: "arch"
          operator: "Equal"
          value: "s390x"
          effect: "NoSchedule"
      containers:
        - name: mongodb
          # IBM/MongoDB OEM s390x image. Substitute the tag from the IBM
          # entitlement or your internal mirror -- there is no community
          # s390x manifest to fall back to.
          image: <PLACEHOLDER_IBM_OEM_MONGODB_S390X_IMAGE>
          args:
            - "--replSet"
            - "rs0"
            - "--bind_ip_all"
          ports:
            - containerPort: 27017
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mongodb-demo-root
                  key: username
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongodb-demo-root
                  key: password
          resources:
            requests:
              cpu: "500m"
              memory: "2Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          volumeMounts:
            - name: data
              mountPath: /data/db
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi

---
# --- Replica-set initiation --------------------------------------------------
# Runs once. Without this the source connector cannot open a change stream.
# Idempotent: rs.initiate() on an already-initiated set returns an error that
# we swallow, so re-running the Job is safe.
apiVersion: batch/v1
kind: Job
metadata:
  name: mongodb-demo-rs-init
  namespace: confluent
  labels:
    app: mongodb-demo
    app.kubernetes.io/part-of: fsi-linuxone-demo
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/arch
                    operator: In
                    values:
                      - s390x
      tolerations:
        - key: "arch"
          operator: "Equal"
          value: "s390x"
          effect: "NoSchedule"
      containers:
        - name: rs-init
          # Same OEM s390x image -- this Job only needs mongosh, but it must
          # be the s390x build to schedule on an s390x-pinned cluster.
          image: <PLACEHOLDER_IBM_OEM_MONGODB_S390X_IMAGE>
          env:
            - name: MONGO_USER
              valueFrom:
                secretKeyRef:
                  name: mongodb-demo-root
                  key: username
            - name: MONGO_PASS
              valueFrom:
                secretKeyRef:
                  name: mongodb-demo-root
                  key: password
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              HOST="mongodb-demo-0.mongodb-demo.confluent.svc.cluster.local:27017"

              echo "waiting for mongod to answer..."
              until mongosh --quiet \
                    -u "$MONGO_USER" -p "$MONGO_PASS" \
                    --authenticationDatabase admin \
                    "mongodb://${HOST}/?directConnection=true" \
                    --eval 'db.adminCommand({ping:1})' >/dev/null 2>&1; do
                sleep 3
              done

              echo "initiating replica set rs0 (idempotent)..."
              mongosh --quiet \
                -u "$MONGO_USER" -p "$MONGO_PASS" \
                --authenticationDatabase admin \
                "mongodb://${HOST}/?directConnection=true" --eval "
                  try {
                    rs.initiate({_id:'rs0', members:[{_id:0, host:'${HOST}'}]});
                    print('rs.initiate() OK');
                  } catch (e) {
                    if (e.codeName === 'AlreadyInitialized') {
                      print('already initialized - nothing to do');
                    } else { throw e; }
                  }
                "

              echo "waiting for PRIMARY..."
              until mongosh --quiet \
                    -u "$MONGO_USER" -p "$MONGO_PASS" \
                    --authenticationDatabase admin \
                    "mongodb://${HOST}/?directConnection=true" \
                    --eval 'quit(db.hello().isWritablePrimary ? 0 : 1)'; do
                sleep 3
              done

              echo "seeding demo collection so the source connector has data..."
              mongosh --quiet \
                -u "$MONGO_USER" -p "$MONGO_PASS" \
                --authenticationDatabase admin \
                "mongodb://${HOST}/?replicaSet=rs0" --eval "
                  db.getSiblingDB('demo').customer.insertOne(
                    {name:'seed', created:new Date()});
                  print('seeded demo.customer');
                "

              echo "DONE - replica set rs0 is PRIMARY and change streams are available"
