# =============================================================================
# CFK on OCP on LinuxONE (s390x) -- DEMO Connect cluster (MongoDB source + sink)
# =============================================================================
# ONE Connect cluster for the demo. The production scenario splits Connect into
# three clusters (connect / connect-lakehouse / connect-databases) so that a
# replication-slot stall cannot back up the audit pipeline -- that isolation is
# deliberate there and deliberately dropped here.
#
# ---------------------------------------------------------------------------
# BUDGET: Connect fits INSIDE the fixed 32-IFL BoM, paid for by trimming the
# broker tier. It is not an addition to the ask.
# ---------------------------------------------------------------------------
# z-stream-sizer models four control-plane components -- KRaft, Schema
# Registry, Control Center, CMF -- and no Connect tier at all (verified: no
# occurrence of "connect" in sizing.go or web/index.html). Schema Registry is
# inside the 11-IFL control-plane budget; Connect is not modelled anywhere.
#
# The 32-IFL LPAR allocation is fixed. Rather than raise the ask, the broker
# tier was trimmed from the sizer's 12 x86-ref vCPU to 10, which drops the
# Kafka tier from 5 IFLs to 4 and frees exactly one IFL for Connect:
#
#   2 workers x 1000m = 2 logical vCPU = 1 IFL   (SMT-2: ceil(2/2))
#   2 workers x 4 Gi  = 8 GB central storage
#   => estate total 32 IFLs / 207 GB -- inside 32 / 212, with 5 GB spare
#
# WHY TWO WORKERS AT 1000m RATHER THAN ONE AT 2000m: both cost exactly 1 IFL,
# because SMT-2 rounding makes ceil(2x1/2) and ceil(1x2/2) identical. Two
# workers therefore buy worker-restart survivability for 4 GB of RAM and zero
# IFLs. The source connector's 1 task and the sink's 2 also distribute rather
# than stacking on one JVM.
#
# To go the other way -- one worker with a full 2 vCPU -- set replicas: 1 and
# cpu: "2000m". Same IFL cost, 4 GB cheaper, no HA.
#
# The 1-IFL figure is a demo-scale local estimate, NOT a sizer output. A
# production Connect tier carrying real CDC volume is materially larger: the
# prod scenario requests 1500m/3Gi and bursts to 6000m/12Gi per worker.
# =============================================================================

connect:
  name: connect
  replicas: 2

  image:
    # Custom s390x image: CP 8.2.0 base + MongoDB Kafka Connector.
    # Build recipe: ../Dockerfile.connect
    #
    # The MongoDB connector is pure Java, so it carries no s390x risk -- per
    # the s390x support matrix, "connectors that rely on native OS libraries"
    # are the unsupported class, and "pure-Java connectors (Mongo, Debezium)
    # are unaffected."
    application: <PLACEHOLDER_S390X_CONNECT_MONGO_IMAGE>
    init: confluentinc/confluent-init-container:2.11.0
    pullPolicy: IfNotPresent

  resources:
    requests:
      cpu: "1000m"
      memory: "4Gi"
    limits:
      # Burst ceiling only. The 1 IFL budgeted for this tier is 2 logical
      # vCPU total across both workers; the limit lets a single worker take
      # the whole tier briefly during a copy_existing snapshot rather than
      # reserving it.
      cpu: "2000m"
      memory: "4Gi"

  podTemplate:
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/arch
                  operator: In
                  values:
                    - s390x
    tolerations:
      - key: "arch"
        operator: "Equal"
        value: "s390x"
        effect: "NoSchedule"

  tls:
    enabled: false

  # Demo credential handling: a plain Kubernetes Secret, NOT Vault-Agent.
  # Create it before deploying (see ../README.md step 4):
  #   oc create secret generic mongodb-demo-creds -n confluent \
  #     --from-literal=connection_uri='mongodb://<user>:<pass>@mongodb-demo.confluent.svc.cluster.local:27017/?replicaSet=rs0'
  # The connector configs read it as ${file:/mnt/secrets/mongodb:connection_uri}.
  mountedSecrets:
    - secretRef: mongodb-demo-creds
      keyItems:
        - key: connection_uri
          path: mongodb

  dependencies:
    kafka:
      bootstrapEndpoint: kafka.confluent.svc.cluster.local:9071
    schemaRegistry:
      url: http://schemaregistry.confluent.svc.cluster.local:8081
