# Verbatim excerpt: Connect on Z Quickstart, section 3, mq-source.properties.
# Known-bad: "tasks.max=1 # Adjust as needed" sets tasks.max to the string "1 # Adjust as needed".
name=my-mq-source-connector
connector.class=io.confluent.connect.ibm.mq.IbmMQSourceConnector
tasks.max=1 # Adjust as needed

# MQ Connection (Bindings Mode)
mq.queue.manager=YOUR_QMGR_NAME
mq.transport.type=bindings
jms.destination.name=YOUR_MQ_SOURCE_QUEUE_NAME
jms.destination.type=queue

# Kafka Destination
kafka.topic=YOUR_KAFKA_DESTINATION_TOPIC
