# Verbatim excerpt: Connect on Z Quickstart (reference/connect-on-z-quickstart-2025-08.pdf),
# section 5 "Distributed Mode", listing lines 26-58. Known-bad input for tests/test_lint.py:
# every inline "# ..." below becomes part of the property value, and rest.port has been a
# no-op since Apache Kafka 3.0.
# -------------------------------------------------------------------------------------
# Distributed Mode Specifics (Replaces standalone.properties offset.storage.file.filename)
  # These topics must exist in your Kafka cluster and are used by Connect for coordination.
  # Ensure the topics are configured for appropriate replication and retention.

  # Offset Storage (shared across all Connect workers)
  offset.storage.partitions=25 # Number of partitions for the offset topic
  offset.storage.replication.factor=3 # Replication factor for the offset topic
  offset.storage.topic=connect-offsets # Topic for storing connector offsets

# Configuration Storage (shared across all Connect workers for connector and task configurations)
config.storage.partitions=1 # Typically 1 partition is sufficient
config.storage.replication.factor=3 # Replication factor for the config topic
config.storage.topic=connect-configs # Topic for storing connector configurations

# Status Storage (shared across all Connect workers for connector and task statuses)
status.storage.partitions=5 # Number of partitions for the status topic
status.storage.replication.factor=3 # Replication factor for the status topic
status.storage.topic=connect-status # Topic for storing connector status updates

# Internal Kafka Connect Consumer Group ID
group.id=connect-cluster # Unique ID for this Connect cluster, used for internal consumer groups

# -------------------------------------------------------------------------------------
# Plugin Path (Update with your actual paths on each worker)
plugin.path=/u/connectuser/connectors/mq-source,/u/connectuser/connectors/mq-sink

# REST API Settings (Each worker will expose its own REST API)
rest.port=8082
rest.advertised.host.name=your-connect-worker-hostname # Important for REST API discovery by other workers
rest.advertised.port=8082 # Important for REST API discovery by other workers
bootstrap.servers=YOUR_KAFKA_BOOTSTRAP:9092
