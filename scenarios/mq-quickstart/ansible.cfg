# =============================================================================
# mq-quickstart -- scenario-local Ansible configuration
# =============================================================================
# Deliberately not inheriting fsi-dsp's ansible/ansible.cfg: it sets sudo
# become and the dev inventory, both wrong for a z/OS target. The z/OS user
# is the started task's own user; nothing here escalates.
# =============================================================================
[defaults]
inventory = ./inventory.yml
collections_path = ./collections
# cp_connect (connector registration) is reused from fsi-dsp, unchanged.
roles_path = ../../ansible/roles
filter_plugins = ./filter_plugins
retry_files_enabled = False

[privilege_escalation]
become = False
