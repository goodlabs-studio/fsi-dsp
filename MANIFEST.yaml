# MANIFEST.yaml v1 — Stable contract between fsi-dsp and cflt-ai
# Every asset in this file has a stable ID that MUST NOT be removed
# without a major version bump. See CNTR-04 CI enforcement.
version: "1.2.0"
schema: "fsi-dsp/manifest/v1"

capabilities:
  # ──────────────────────────────────────────────────
  # Ansible Roles (9)
  # ──────────────────────────────────────────────────
  - id: "role/cp_topic"
    type: ansible-role
    name: "cp_topic"
    path: "ansible/roles/cp_topic"
    description: "Create and manage governed Kafka topics on Confluent Platform"

  - id: "role/cp_schema"
    type: ansible-role
    name: "cp_schema"
    path: "ansible/roles/cp_schema"
    description: "Register and manage Avro schemas in Confluent Schema Registry"

  - id: "role/cp_rbac"
    type: ansible-role
    name: "cp_rbac"
    path: "ansible/roles/cp_rbac"
    description: "Provision role bindings for Confluent Platform RBAC"

  - id: "role/cp_connect"
    type: ansible-role
    name: "cp_connect"
    path: "ansible/roles/cp_connect"
    description: "Deploy and configure Kafka Connect distributed workers"

  - id: "role/cp_dr_mm2"
    type: ansible-role
    name: "cp_dr_mm2"
    path: "ansible/roles/cp_dr_mm2"
    description: "Configure MirrorMaker 2 for cross-cluster replication"

  - id: "role/cp_dr_mrc"
    type: ansible-role
    name: "cp_dr_mrc"
    path: "ansible/roles/cp_dr_mrc"
    description: "Configure multi-region cluster for DR replication"

  - id: "role/cp_observability"
    type: ansible-role
    name: "cp_observability"
    path: "ansible/roles/cp_observability"
    description: "Deploy observability agents and metric exporters"

  - id: "role/cfk_operator"
    type: ansible-role
    name: "cfk_operator"
    path: "ansible/roles/cfk_operator"
    description: "Install Confluent for Kubernetes operator on OpenShift"

  - id: "role/cfk_topic"
    type: ansible-role
    name: "cfk_topic"
    path: "ansible/roles/cfk_topic"
    description: "Manage Kafka topics via CFK custom resources"

  # ──────────────────────────────────────────────────
  # Terraform Modules (3)
  # ──────────────────────────────────────────────────
  - id: "module/topic"
    type: terraform-module
    name: "topic"
    path: "modules/topic"
    description: "Single-call governed topic: topic + schema + RBAC + DR mirror"

  - id: "module/flink"
    type: terraform-module
    name: "flink"
    path: "modules/flink"
    description: "Flink compute pool and statement provisioning on Confluent Cloud"

  - id: "module/cc-cluster-basic"
    type: terraform-module
    name: "cc-cluster-basic"
    path: "modules/cc-cluster-basic"
    description: "Provisions a Basic-tier Confluent Cloud Kafka cluster (single-zone, no CL destination, no mTLS, no private networking) inside an existing environment. Outputs are shaped for scenario/cc-* clusters.auto.tfvars consumption. Smoke/dev only — Basic cannot satisfy FSI production canon (no multi-AZ, no DR cluster linking)."

  # ──────────────────────────────────────────────────
  # Scenarios (6)
  # ──────────────────────────────────────────────────
  - id: "scenario/cc-aws"
    type: scenario
    name: "cc-aws"
    path: "scenarios/cc-aws"
    description: "Confluent Cloud on AWS starter kit"

  - id: "scenario/cc-azure"
    type: scenario
    name: "cc-azure"
    path: "scenarios/cc-azure"
    description: "Confluent Cloud on Azure starter kit"

  - id: "scenario/cc-gcp"
    type: scenario
    name: "cc-gcp"
    path: "scenarios/cc-gcp"
    description: "Confluent Cloud on GCP starter kit"

  - id: "scenario/cfk-openshift"
    type: scenario
    name: "cfk-openshift"
    path: "scenarios/cfk-openshift"
    description: "Confluent for Kubernetes on OpenShift starter kit"

  - id: "scenario/cp-rhel"
    type: scenario
    name: "cp-rhel"
    path: "scenarios/cp-rhel"
    description: "Confluent Platform on RHEL starter kit"

  - id: "scenario/private-cloud"
    type: scenario
    name: "private-cloud"
    path: "scenarios/private-cloud"
    description: "Confluent Private Cloud starter kit"

  # ──────────────────────────────────────────────────
  # Architecture Decision Records (10)
  # ──────────────────────────────────────────────────
  - id: "adr/001"
    type: adr
    name: "Avro over Protobuf"
    path: "docs/adr/001-avro-over-protobuf.md"
    status: accepted

  - id: "adr/002"
    type: adr
    name: "Compatibility by tier"
    path: "docs/adr/002-compatibility-by-tier.md"
    status: accepted

  - id: "adr/003"
    type: adr
    name: "Consul service discovery"
    path: "docs/adr/003-consul-service-discovery.md"
    status: accepted

  - id: "adr/004"
    type: adr
    name: "On-prem Connect"
    path: "docs/adr/004-onprem-connect.md"
    status: accepted

  - id: "adr/005"
    type: adr
    name: "Cluster Linking over MRC"
    path: "docs/adr/005-cluster-linking-over-mrc.md"
    status: accepted

  - id: "adr/006"
    type: adr
    name: "OAuth vs API keys"
    path: "docs/adr/006-oauth-vs-api-keys.md"
    status: accepted

  - id: "adr/007"
    type: adr
    name: "Topic naming"
    path: "docs/adr/007-topic-naming.md"
    status: accepted

  - id: "adr/008"
    type: adr
    name: "DR tier classification"
    path: "docs/adr/008-dr-tier-classification.md"
    status: accepted

  - id: "adr/009"
    type: adr
    name: "LinuxONE for z/OS Kafka offload"
    path: "docs/adr/009-linuxone-kafka-offload.md"
    status: proposed

  - id: "adr/010"
    type: adr
    name: "Low-latency Azure Kafka client profile"
    path: "docs/adr/010-low-latency-azure-kafka-profile.md"
    status: accepted

  # ──────────────────────────────────────────────────
  # Reference Implementations (14)
  # ──────────────────────────────────────────────────
  - id: "reference/java-producer"
    type: reference
    name: "Java Producer"
    path: "reference/java-producer"
    description: "FSI-ready Java producer with idempotency, Avro, DLQ"

  - id: "reference/java-consumer"
    type: reference
    name: "Java Consumer"
    path: "reference/java-consumer"
    description: "FSI-ready Java consumer with manual commit, Avro deserialization"

  - id: "reference/java-producer-low-latency-azure"
    type: reference
    name: "Java Producer (Low-Latency Azure)"
    path: "reference/java-producer-low-latency-azure"
    description: "Java producer variant: latency-favored tuning + ILB-aware connection management. See ADR-010."
    capabilities:
      latency_tier: sub_100ms
      cloud: azure
      connection_resilience: ilb_aware

  - id: "reference/java-consumer-low-latency-azure"
    type: reference
    name: "Java Consumer (Low-Latency Azure)"
    path: "reference/java-consumer-low-latency-azure"
    description: "Java consumer variant: cooperative-sticky + static membership, decoupled poll/process with backpressure, ILB-aware connection management. See ADR-010."
    capabilities:
      latency_tier: sub_100ms
      cloud: azure
      connection_resilience: ilb_aware
      backpressure: queue_decoupled

  - id: "reference/dotnet-producer"
    type: reference
    name: ".NET Producer"
    path: "reference/dotnet-producer"
    description: ".NET Kafka producer for non-JVM teams"

  - id: "reference/dotnet-consumer"
    type: reference
    name: ".NET Consumer"
    path: "reference/dotnet-consumer"
    description: ".NET Kafka consumer for non-JVM teams"

  - id: "reference/python-producer"
    type: reference
    name: "Python Producer"
    path: "reference/python-producer"
    description: "Python Kafka producer with Avro serialization and DLQ"

  - id: "reference/python-consumer"
    type: reference
    name: "Python Consumer"
    path: "reference/python-consumer"
    description: "Python Kafka consumer with manual commit and handler injection"

  - id: "reference/python-producer-low-latency-azure"
    type: reference
    name: "Python Producer (Low-Latency Azure)"
    path: "reference/python-producer-low-latency-azure"
    description: "Python producer variant: latency-favored tuning + ILB-aware connection management. See ADR-010."
    capabilities:
      latency_tier: sub_100ms
      cloud: azure
      connection_resilience: ilb_aware

  - id: "reference/python-consumer-low-latency-azure"
    type: reference
    name: "Python Consumer (Low-Latency Azure)"
    path: "reference/python-consumer-low-latency-azure"
    description: "Python consumer variant: latency-favored tuning, cooperative-sticky + static membership, ILB-aware connection management. See ADR-010."
    capabilities:
      latency_tier: sub_100ms
      cloud: azure
      connection_resilience: ilb_aware

  - id: "reference/flink-sql"
    type: reference
    name: "Flink SQL"
    path: "reference/flink-sql"
    description: "Flink SQL job examples for stream processing on Confluent Cloud"

  - id: "reference/connect-configs"
    type: reference
    name: "Connect Configs"
    path: "reference/connect-configs"
    description: "JDBC source/sink connector configurations for multiple databases"

  - id: "reference/integration-test"
    type: reference
    name: "Integration Test"
    path: "reference/integration-test"
    description: "End-to-end roundtrip test: produce, schema, consume, verify"

  - id: "reference/local-dev"
    type: reference
    name: "Local Dev"
    path: "reference/local-dev"
    description: "Docker Compose stack for local Kafka/SR/Connect development"

  # ──────────────────────────────────────────────────
  # Operational Scripts (7)
  # ──────────────────────────────────────────────────
  - id: "script/mirror-failover"
    type: script
    name: "mirror-failover.sh"
    path: "scripts/mirror-failover.sh"
    description: "DR failover via Cluster Linking mirror promotion"

  - id: "script/mirror-failback"
    type: script
    name: "mirror-failback.sh"
    path: "scripts/mirror-failback.sh"
    description: "DR failback to primary region after incident resolution"

  - id: "script/fsi-dr"
    type: script
    name: "fsi-dr.sh"
    path: "scripts/fsi-dr.sh"
    description: "Orchestrated DR failover across Kafka, SR, and databases"

  - id: "script/consul-flip-region"
    type: script
    name: "consul-flip-region.sh"
    path: "scripts/consul-flip-region.sh"
    description: "Atomic region flip via Consul KV for service discovery"

  - id: "script/connect-pause-all"
    type: script
    name: "connect-pause-all.sh"
    path: "scripts/connect-pause-all.sh"
    description: "Pause all Kafka Connect connectors during maintenance"

  - id: "script/validate-apply"
    type: script
    name: "validate-apply.sh"
    path: "scripts/validate-apply.sh"
    description: "Pre-flight validation before Terraform apply"

  - id: "script/validate-fips"
    type: script
    name: "validate-fips.sh"
    path: "scripts/validate-fips.sh"
    description: "Validate FIPS 140-2 compliance on target nodes"

  # ──────────────────────────────────────────────────
  # Observability Configs (6 + 1 doc)
  # ──────────────────────────────────────────────────
  - id: "observability/datadog"
    type: observability
    name: "Datadog"
    path: "observability/datadog"
    description: "Datadog dashboard and monitor templates for Kafka/Flink"

  - id: "observability/dynatrace"
    type: observability
    name: "Dynatrace"
    path: "observability/dynatrace"
    description: "Dynatrace metric and alerting configuration for Kafka"

  - id: "observability/grafana"
    type: observability
    name: "Grafana"
    path: "observability/grafana"
    description: "Grafana dashboard JSON models for Kafka monitoring"

  - id: "observability/instana"
    type: observability
    name: "Instana"
    path: "observability/instana"
    description: "Instana sensor configuration for Kafka tracing"

  - id: "observability/newrelic"
    type: observability
    name: "New Relic"
    path: "observability/newrelic"
    description: "New Relic integration for Kafka metrics and logs"

  - id: "observability/splunk"
    type: observability
    name: "Splunk"
    path: "observability/splunk"
    description: "Splunk log forwarding and dashboard for Kafka operations"

  - id: "observability/metrics-mapping"
    type: observability
    name: "Metrics Mapping"
    path: "observability/metrics-mapping.md"
    description: "Cross-provider metric name mapping reference"

  # ──────────────────────────────────────────────────
  # Accelerators (1)
  # ──────────────────────────────────────────────────
  - id: "accelerator/confluent-on-linuxone"
    type: accelerator
    name: "confluent-on-linuxone"
    path: "accelerators/confluent-on-linuxone"
    description: "Confluent Platform on IBM LinuxONE — FSI-hardened RBAC + mTLS + SR governance + audit + Flink layers via Kustomize Components over Mondics's upstream base"
    apply_sequence:
      - layer: "01-rbac"
        path: "accelerators/confluent-on-linuxone/layers/01-rbac"
        canon_key: "fsi.security.mds-rbac"
      - layer: "02-tls"
        path: "accelerators/confluent-on-linuxone/layers/02-tls"
        canon_key: "fsi.security.tls-fips"
      - layer: "03-schema-governance"
        path: "accelerators/confluent-on-linuxone/layers/03-schema-governance"
        canon_key: "fsi.schema.compatibility-full-transitive"
      - layer: "04-audit"
        path: "accelerators/confluent-on-linuxone/layers/04-audit"
        canon_key: "fsi.audit.events-retention"
      - layer: "05-flink"
        path: "accelerators/confluent-on-linuxone/layers/05-flink"
        canon_key: "fsi.flink.environment-mtls"
    build_command: "kustomize build overlays/prod"
    dry_run_command: "kustomize build overlays/prod | oc apply --dry-run=server -f -"
    apply_command: "kustomize build overlays/prod | oc apply -f -"

  # ──────────────────────────────────────────────────
  # Registrations from ADR-011 (lakehouse) + ADR-012 (database connectors)
  # + LinuxONE scenarios + miscellaneous strays — landed via stray-asset
  # gate enforcement from cflt-ai check-canon-parity.py. Each entry below
  # was previously on disk but not registered; canon governance requires
  # explicit registration so cflt-ai can resolve fsi-dsp:// URIs and gate
  # per-type compliance.
  # ──────────────────────────────────────────────────

  # ── Terraform modules (3 — new from ADR-011, ADR-012) ──
  - id: "module/db_connector"
    type: terraform-module
    name: "db_connector"
    path: "modules/db_connector"
    description: "Polymorphic Confluent Cloud managed connector for operational databases (MongoDB, Redis, CockroachDB, PostgreSQL — source or sink). Per ADR-012."
    canon_key: "connector_config"

  - id: "module/lakehouse_sink"
    type: terraform-module
    name: "lakehouse_sink"
    path: "modules/lakehouse_sink"
    description: "Confluent Cloud managed connector for Databricks Delta Lake or Snowflake Snowpipe Streaming sink. Per ADR-011."
    canon_key: "lakehouse_sink_config"

  - id: "module/tableflow"
    type: terraform-module
    name: "tableflow"
    path: "modules/tableflow"
    description: "Enables Confluent Tableflow on a topic and wires the materialized table (Iceberg or Delta) into Databricks Unity Catalog or Snowflake Open Catalog. Per ADR-011."
    canon_key: "tableflow_config"

  # ── Ansible roles (8 — DB connectors + lakehouse sinks + flink operators + pre-existing mTLS) ──
  - id: "role/cp_cockroachdb"
    type: ansible-role
    name: "cp_cockroachdb"
    path: "ansible/roles/cp_cockroachdb"
    description: "Deploy CockroachDB CDC source connector (changefeed → Kafka) for self-managed Confluent Platform. Per ADR-012."

  - id: "role/cp_mongodb"
    type: ansible-role
    name: "cp_mongodb"
    path: "ansible/roles/cp_mongodb"
    description: "Deploy MongoDB source/sink connectors for self-managed Confluent Platform. Per ADR-012."

  - id: "role/cp_postgres"
    type: ansible-role
    name: "cp_postgres"
    path: "ansible/roles/cp_postgres"
    description: "Deploy PostgreSQL Debezium CDC source + JDBC sink connectors for self-managed Confluent Platform. Per ADR-012."

  - id: "role/cp_redis"
    type: ansible-role
    name: "cp_redis"
    path: "ansible/roles/cp_redis"
    description: "Deploy Redis sink connector for self-managed Confluent Platform. Per ADR-012."

  - id: "role/cp_databricks_sink"
    type: ansible-role
    name: "cp_databricks_sink"
    path: "ansible/roles/cp_databricks_sink"
    description: "Deploy Databricks Delta Lake sink connector for self-managed Confluent Platform. Per ADR-011 (DB-C path)."

  - id: "role/cp_snowflake_sink"
    type: ansible-role
    name: "cp_snowflake_sink"
    path: "ansible/roles/cp_snowflake_sink"
    description: "Deploy Snowflake Snowpipe Streaming sink connector for self-managed Confluent Platform. Per ADR-011 (SF-A path)."

  - id: "role/cp_mtls"
    type: ansible-role
    name: "cp_mtls"
    path: "ansible/roles/cp_mtls"
    description: "Configure mTLS on listeners + client truststore/keystore for self-managed Confluent Platform brokers."

  - id: "role/flink_operators"
    type: ansible-role
    name: "flink_operators"
    path: "ansible/roles/flink_operators"
    description: "Install Confluent Flink Operator + Confluent Manager for Flink Helm charts on OCP for the LinuxONE accelerator's layer 05-flink prerequisite."

  # ── Scenarios (2 — LinuxONE variants from v3.0 milestone) ──
  - id: "scenario/cfk-openshift-linuxone"
    type: scenario
    name: "cfk-openshift-linuxone"
    path: "scenarios/cfk-openshift-linuxone"
    description: "CFK on OCP deployment scenario targeting IBM LinuxONE / s390x worker nodes. Helm-values + Ansible orchestration; precedes the kustomize-based accelerator/confluent-on-linuxone."

  - id: "scenario/cp-rhel-linuxone"
    type: scenario
    name: "cp-rhel-linuxone"
    path: "scenarios/cp-rhel-linuxone"
    description: "Confluent Platform on RHEL deployment scenario targeting IBM LinuxONE / s390x with IBM Semeru JDK + FIPS + JCEKS keystore overrides. Lakehouse playbooks per ADR-011."

  # ── References (1 — new from ADR-012) ──
  - id: "reference/cockroachdb"
    type: reference
    name: "cockroachdb"
    path: "reference/cockroachdb"
    description: "CockroachDB changefeed reference examples (SQL statements + connector wiring) for CDC to Kafka. Per ADR-012."

  # ── Scripts (1 — manifest-stability CI guard) ──
  - id: "script/check-manifest-stability"
    type: script
    name: "check-manifest-stability.py"
    path: "scripts/check-manifest-stability.py"
    description: "CNTR-04 CI enforcement: asserts no MANIFEST capability ID has been removed between versions without a major version bump. Run in CI on every PR."

  # ── ADRs (2 — ADR-011 lakehouse, ADR-012 database connectors) ──
  - id: "adr/011-lakehouse-integration-patterns"
    type: adr
    name: "ADR-011: Lakehouse Integration Patterns"
    path: "docs/adr/011-lakehouse-integration-patterns.md"
    description: "Four lakehouse paths (Tableflow→Databricks UC, Tableflow→Snowflake Open Catalog, Databricks Delta Lake Sink, Snowflake Snowpipe Streaming) across deployment models. Scoped exception to ADR-004 for CC-source SaaS-lakehouse pairs only."

  - id: "adr/012-database-connector-patterns"
    type: adr
    name: "ADR-012: Database Connector Patterns"
    path: "docs/adr/012-database-connector-patterns.md"
    description: "MongoDB, Redis, CockroachDB, PostgreSQL CDC/sink connectors across CC managed, CP self-managed, CFK, and CP-on-RHEL-on-LinuxONE deployment models. Polymorphic module/db_connector packages CC variants; ansible roles wrap self-managed."
